name: Deploy LiveKit Agent

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy LiveKit Agent
        uses: livekit/deploy-action@v2
        with:
          api-key: ${{ secrets.LIVEKIT_API_KEY }}
          api-secret: ${{ secrets.LIVEKIT_API_SECRET }}